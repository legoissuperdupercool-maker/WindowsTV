<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Transparent window: the body background is controlled per-route so mpv
         video (behind this window) shows through during playback. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'"
    />
    <title>ello smartTV</title>
    <!-- Shown instantly (before any JS loads); React replaces #root's content. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0e1013; }
      .splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; color: #e8eaed; animation: splash-in .5s ease both; }
      .splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
      .splash .name { font-size: 22px; letter-spacing: -.01em; }
      .splash .name b { font-weight: 700; }
      .splash .name span { color: #9aa0a6; font-weight: 400; }
      .splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
      .splash .bar i { display: block; width: 40%; height: 100%; background: #4c8dff; border-radius: 3px; animation: splash-bar 1.1s ease-in-out infinite; }
      @keyframes splash-in { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
      @keyframes splash-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <img src="./icon.png" alt="" />
        <div class="name"><b>ello<span style="color:#4c8dff">.</span></b> <span>smartTV</span></div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
