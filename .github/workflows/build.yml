name: Build Windows EXE

# Builds the real Windows executables (installer + portable) on a Windows runner.
# mpv is downloaded and bundled automatically (GitHub's windows-latest image ships
# 7-Zip, which the fetch script uses to extract the mpv archive).

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch: # lets you run it manually from the Actions tab
  release:
    types: [created]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Token that can publish to the public update-feed repo. Optional: when it
      # isn't set, that step is skipped and builds still go to this repo.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch & bundle mpv
        run: node scripts/fetch-mpv.mjs

      - name: Verify mpv was bundled
        shell: pwsh
        run: |
          if (Test-Path "resources/mpv/mpv.exe") {
            Write-Host "mpv.exe bundled OK"
          } else {
            Write-Warning "mpv.exe not bundled; the app will rely on a system/Settings mpv."
          }

      # Every build gets a unique, increasing version (0.1.<run number>) so the
      # in-app updater can tell which build is newer.
      - name: Set build version
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version

      - name: Build installers
        # Publishing is handled by the release step below, not electron-builder.
        run: npm run build && npx electron-builder --win --publish never
        env:
          # Unsigned build — no code-signing certificate configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Every build is published as a GitHub pre-release so the EXEs can be
      # downloaded from the Releases page. Release assets don't count against the
      # account's Actions artifact storage quota (which can fill up).
      - name: Publish build as a pre-release
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ello smartTV — build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic Windows build from `${{ github.ref_name }}` @ ${{ github.sha }}.

            - **ello-smartTV-*-Setup.exe** — installer
            - **ello-smartTV-*-Portable.exe** — run directly, no install

            Unsigned build: on first launch Windows SmartScreen may warn — choose
            *More info → Run anyway*.
          files: release/*.exe
          fail_on_unmatched_files: true

      - name: Publish to public update feed (ello-smarttv-releases)
        if: env.RELEASES_TOKEN != '' && github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          repository: legoissuperdupercool-maker/ello-smarttv-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v0.1.${{ github.run_number }}
          name: ello smartTV 0.1.${{ github.run_number }}
          body: |
            ello smartTV 0.1.${{ github.run_number }} for Windows.

            - **ello-smartTV-*-Setup.exe** — installer (updates itself automatically)
            - **ello-smartTV-*-Portable.exe** — run directly, no install (no auto-update)

            Unsigned build: Windows SmartScreen may warn on first launch — choose
            *More info → Run anyway*.
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true

      - name: Attach EXEs to GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          fail_on_unmatched_files: true

      # Best-effort extra copy as a workflow artifact; never fails the build if
      # the account's artifact storage quota is full.
      - name: Upload EXEs as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ello-smartTV-exe
          path: release/*.exe
          if-no-files-found: warn
          retention-days: 3
