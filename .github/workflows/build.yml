name: Build Windows EXE

# Builds the real Windows executables (installer + portable) on a Windows runner.
# mpv is downloaded and bundled automatically (GitHub's windows-latest image ships
# 7-Zip, which the fetch script uses to extract the mpv archive).

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch: # lets you run it manually from the Actions tab
  release:
    types: [created]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch & bundle mpv
        run: node scripts/fetch-mpv.mjs

      - name: Verify mpv was bundled
        shell: pwsh
        run: |
          if (Test-Path "resources/mpv/mpv.exe") {
            Write-Host "mpv.exe bundled OK"
          } else {
            Write-Warning "mpv.exe not bundled; the app will rely on a system/Settings mpv."
          }

      - name: Build installers
        run: npm run build:win
        env:
          # Unsigned build — no code-signing certificate configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXEs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ello-smartTV-exe
          path: |
            release/*.exe
            dist/*.exe
          if-no-files-found: warn

      - name: Attach EXEs to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            dist/*.exe
