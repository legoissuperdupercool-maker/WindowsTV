appId: com.ello.smarttv
productName: ello smartTV
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!installer/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.prettierrc,.prettierignore,.editorconfig}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc}'
asar: true
asarUnpack:
  - resources/**
# Anti-tamper: flip Electron fuses at package time. Embedded ASAR integrity
# validation makes the app refuse to run if app.asar is modified, and the rest
# close off ways to run the binary as a plain Node process to bypass app code.
# (This is belt-and-braces with the panel's own integrity allowlist.)
electronFuses:
  runAsNode: false
  enableRunAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - nsis        # a normal installer .exe
    - portable    # a single self-contained .exe (no install needed)
  # The mpv binary is shipped as an unpacked resource so it can be spawned as a
  # child process at runtime.
  extraResources:
    - from: resources/mpv
      to: mpv
      filter:
        - '**/*'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: ello smartTV
  # The standard NSIS wizard. Users download the custom setup window
  # (installer/, ello-smartTV-<v>-Setup.exe), which runs this one silently; the
  # auto-updater also downloads this one (see latest.yml).
  artifactName: ello-smartTV-${version}-Setup-Classic.${ext}
portable:
  artifactName: ello-smartTV-${version}-Portable.${ext}
# Auto-update feed: a separate PUBLIC repo that only holds release installers
# (the source repo is private). CI publishes there; the app reads from there.
publish:
  provider: github
  owner: legoissuperdupercool-maker
  repo: ello-smarttv-releases
  releaseType: release
